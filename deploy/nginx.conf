# Template nginx config. Copy to /etc/nginx/sites-available/school,
# then symlink it: sudo ln -s /etc/nginx/sites-available/school /etc/nginx/sites-enabled/
#
# Replace yourschooldomain.com with your actual domain before enabling.
# Run `sudo certbot --nginx -d yourschooldomain.com` afterward — it edits
# this file automatically to add the HTTPS block and redirect, so don't
# hand-write the SSL section yourself.

server {
    listen 80;
    server_name yourschooldomain.com www.yourschooldomain.com;

    client_max_body_size 12M;   # a little above the app's own 10MB upload limit

    location /static/ {
        alias /var/www/school_management/app/static/;
        expires 30d;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/var/www/school_management/school.sock;
    }
}
