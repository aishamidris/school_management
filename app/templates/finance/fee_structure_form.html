{% extends "base.html" %}
{% block title %}New Fee Structure{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-3">
  <a href="{{ url_for('finance.list_fee_structures') }}" class="btn btn-sm btn-outline-secondary me-2">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h4 class="mb-0">New Fee Structure</h4>
</div>

<form method="POST" class="card">
  <div class="card-body">
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label">Class *</label>
        <select name="school_class_id" class="form-select" required>
          <option value="">Select class</option>
          {% for c in classes %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Term *</label>
        <select name="term_id" class="form-select" required>
          <option value="">Select term</option>
          {% for t in terms %}
          <option value="{{ t.id }}">{{ t.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <h6 class="text-muted text-uppercase small mb-2">Fee Items</h6>
    <div id="fee-items">
      <div class="row g-2 mb-2 fee-item-row">
        <div class="col-6"><input type="text" name="item_label[]" class="form-control" placeholder="e.g. Tuition"></div>
        <div class="col-4"><input type="number" step="0.01" name="item_amount[]" class="form-control" placeholder="Amount (₦)"></div>
        <div class="col-2"><button type="button" class="btn btn-outline-danger w-100 remove-row">&times;</button></div>
      </div>
    </div>
    <button type="button" id="add-row" class="btn btn-sm btn-outline-secondary mt-1">
      <i class="bi bi-plus"></i> Add Item
    </button>

    <div class="mt-3">
      <strong>Running Total: ₦<span id="running-total">0</span></strong>
    </div>
  </div>
  <div class="card-footer text-end bg-white">
    <a href="{{ url_for('finance.list_fee_structures') }}" class="btn btn-outline-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary">Create Fee Structure</button>
  </div>
</form>

<script>
document.getElementById('add-row').addEventListener('click', function () {
  const container = document.getElementById('fee-items');
  const row = container.querySelector('.fee-item-row').cloneNode(true);
  row.querySelectorAll('input').forEach(i => i.value = '');
  container.appendChild(row);
});

document.getElementById('fee-items').addEventListener('click', function (e) {
  if (e.target.classList.contains('remove-row')) {
    const rows = document.querySelectorAll('.fee-item-row');
    if (rows.length > 1) e.target.closest('.fee-item-row').remove();
    updateTotal();
  }
});

document.getElementById('fee-items').addEventListener('input', updateTotal);

function updateTotal() {
  let total = 0;
  document.querySelectorAll('input[name="item_amount[]"]').forEach(i => {
    total += parseFloat(i.value) || 0;
  });
  document.getElementById('running-total').textContent = total.toLocaleString();
}
</script>
{% endblock %}
